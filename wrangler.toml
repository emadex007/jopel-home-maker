name = "jopearl-home-maker"
main = "./src/server.ts"
compatibility_date = "2025-09-02"
compatibility_flags = ["nodejs_compat"]

# Jo-pearl Home Maker: served on the workers.dev URL first
workers_dev = true

# --- Custom domain: uncomment once Jo-pearl's domain is linked to Cloudflare ---
# routes = [
#   { pattern = "jopearlhomemaker.com", custom_domain = true },
#   { pattern = "www.jopearlhomemaker.com", custom_domain = true }
# ]

# --- D1 database (projects, project photos, services, bookings, quotes, chat, staff, site settings) ---
[[d1_databases]]
binding = "DB"
database_name = "jopearl_home_maker_db"
database_id = "c6ece321-b3be-484d-ac37-ac1050bb1030"
migrations_dir = "migrations"

# --- R2 bucket (logo, banners, portfolio photos, quote-request uploads) ---
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "jopearl-home-maker-media"

# --- Secrets: set with `npx wrangler secret put <NAME>`, never commit them ---
# RESEND_API_KEY        booking / quote / chat notification emails
# ADMIN_NOTIFY_EMAIL    where new inquiries are sent

[vars]
SITE_ENV = "production"